name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치는 보통 develop으로 PR을 생성하기 때문에 develop이 target 브랜치에 포함되어 있다면 별도로 적지 않아도 됩니다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --group worker --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Reject new database triggers and RLS
        run: python scripts/ci/check_database_logic.py

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

      - name: Run Mypy
        run: uv run mypy backend/app ai_worker

  test:
    runs-on: ubuntu-latest

    # 로컬 runner와 달리 GitHub Actions service container의 고정 host port를 사용합니다.
    # 선별 Redis 통합테스트는 인증 없는 127.0.0.1:6379를 기본값으로 사용합니다.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_EXPOSE_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ci_test_password
      DB_NAME: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --group worker --frozen

      - name: Run PostgreSQL migrations
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: uv run alembic -c backend/alembic.ini upgrade head
      # backend/app/tests/conftest.py가 스키마를 재생성하기 전에
      # Alembic이 만든 실제 PostgreSQL 구조를 검증합니다.
      - name: Validate migrated PostgreSQL schema
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: uv run pytest tests/migration -v

      - name: Run Backend Tests with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          uv run coverage run -m pytest backend/app tests/contract tests/integration/rag tests/integration/test_worker_ocr_persistence.py tests/integration/test_outbox_publisher.py tests/integration/test_worker_job_execution_repository.py::test_handler_permanent_failure_marks_real_ocr_job_failed tests/integration/test_worker_job_execution_repository.py::test_worker_runtime_completes_real_redis_postgresql_ocr_one_cycle tests/integration/test_worker_dlq_outbox_repository.py tests/integration/test_worker_recovery_repository.py

      # #347은 앱 기본 test DB로 fallback하지 않고 전용 migrated DB에서 권한·삭제를 검증합니다.
      - name: Verify isolated Source cleanup workflow
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
          DB_NAME: source_cleanup347_test
          SOURCE_CLEANUP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci_test_password@127.0.0.1:5432/source_cleanup347_test
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import asyncpg
          async def create_database():
              connection = await asyncpg.connect(host=os.environ['DB_HOST'], port=int(os.environ['DB_PORT']), user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], database='postgres')
              try:
                  await connection.execute('CREATE DATABASE source_cleanup347_test')
              finally:
                  await connection.close()
          asyncio.run(create_database())
          PY
          uv run alembic -c backend/alembic.ini upgrade head
          uv run coverage run --append -m pytest tests/integration/rag/test_source_cleanup_references.py tests/integration/rag/test_source_cleanup_workflow.py -q

      # ai_worker/tests/evaluation은 외부 서비스 없이 evals/ artifact의 canonical byte와
      # hash 결속만 검증합니다. Dataset·Schema Set 계약의 회귀를 CI에서 잡기 위해 포함합니다.
      - name: Run AI Worker Unit Tests with Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run coverage run --append -m pytest ai_worker/tests/core ai_worker/tests/ocr ai_worker/tests/rag ai_worker/tests/evaluation

      - name: Coverage Report
        run: |
          uv run coverage report -m

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run implemented requirements E2E
        run: pnpm run test:e2e:requirements

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-requirements-failure
          path: |
            frontend/playwright-report/requirements/
            frontend/test-results/requirements/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Frontend
        run: pnpm build

      - name: Lint Frontend
        run: pnpm lint
