services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    # sh -c 형태의 command는 redis 공식 이미지 entrypoint의 gosu 권한 하향 분기를 타지
    # 않아 명시하지 않으면 root로 기동된다(#322). requirepass conf 파일 방식과 충돌하지
    # 않는 것을 확인했다 — 인증 경계가 된 프로세스는 비특권으로 실행한다.
    # 영속 볼륨을 추가할 때는 기존 데이터 소유자를 확인해야 한다. root로 기동됐던
    # 시기의 dump.rdb는 umask 077로 600 root:root이므로, user: redis 상태에서는
    # 읽기 실패로 기동 자체가 막힌다(#322 검증). 볼륨 도입 시 chown 또는 초기화가 필요하다.
    user: redis
    networks:
      - ws
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # requirepass를 --requirepass CLI 인자로 넘기면 컨테이너 프로세스 인자(`ps aux`,
    # `docker top redis`, `/proc/<pid>/cmdline`)에 비밀번호 평문이 그대로 남는다. 대신
    # 컨테이너 안에서만 임시 conf 파일을 생성해 그 경로만 인자로 넘긴다 — 값 자체는
    # 이 sh 프로세스가 exec로 교체되기 전 stdin/redirection으로만 흐르고 별도 프로세스의
    # argv로 노출되지 않는다.
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        cat > /tmp/redis-runtime.conf <<CONF
        requirepass $${REDIS_PASSWORD}
        CONF
        exec redis-server /tmp/redis-runtime.conf
    healthcheck:
      # -a 플래그도 redis-cli 프로세스의 argv로 비밀번호를 노출한다. REDISCLI_AUTH 환경변수를
      # 쓰면 같은 위험 없이 인증할 수 있고, "Using a password with '-a'" 경고도 사라진다.
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: postgres
    restart: always
    environment:
      # Bootstrap/admin 계정은 PostgreSQL 초기화와 역할 구성에만 사용합니다.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}

      # 제한된 Migration·Runtime 역할 생성에 사용합니다.
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SOURCE_WRITER_USER: ${SOURCE_WRITER_USER}
      SOURCE_WRITER_PASSWORD: ${SOURCE_WRITER_PASSWORD}
      KNOWLEDGE_INDEX_BUILDER_USER: ${KNOWLEDGE_INDEX_BUILDER_USER:-}
      KNOWLEDGE_INDEX_BUILDER_PASSWORD: ${KNOWLEDGE_INDEX_BUILDER_PASSWORD:-}
      ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE: ${ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE:-}
      ACCOUNT_WITHDRAWAL_CLEANUP_DB_PASSWORD: ${ACCOUNT_WITHDRAWAL_CLEANUP_DB_PASSWORD:-}
      CATALOG_WRITER_USER: ${CATALOG_WRITER_USER:-}
      CATALOG_WRITER_PASSWORD: ${CATALOG_WRITER_PASSWORD:-}
      CATALOG_APPROVAL_USER: ${CATALOG_APPROVAL_USER:-}
      CATALOG_APPROVAL_PASSWORD: ${CATALOG_APPROVAL_PASSWORD:-}
      CANDIDATE_INDEX_BUILDER_USER: ${CANDIDATE_INDEX_BUILDER_USER:-}
      CANDIDATE_INDEX_BUILDER_PASSWORD: ${CANDIDATE_INDEX_BUILDER_PASSWORD:-}
    networks:
      - ws
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # 권한 설정 SQL을 mount합니다. entrypoint 자동 실행은 데이터 디렉터리가 비어 있는
      # 최초 기동에서만 일어나므로, postgres_data 볼륨에 DB가 이미 있으면 재시작해도
      # 실행되지 않습니다. 다만 표준 배포 경로인 scripts/deployment.sh가 기존 DB에도
      # 매 배포마다 이 SQL을 직접 실행하고(bootstrap) 이어서 provision-db-roles로
      # table 권한까지 적용하므로(provisioning), 별도 수동 작업은 필요하지 않습니다.
      # break-glass로 수동 복구할 때는 이 SQL만으로 table 권한이 반영되지 않으므로
      # provisioning 단계까지 실행해야 합니다.
      #   docker compose exec postgres sh -c 'psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
      #     -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/configure-app-role.sql'
      #   docker compose --profile database-admin run --rm --no-deps provision-db-roles
      - ./postgres/configure-app-role.sql:/docker-entrypoint-initdb.d/configure-app-role.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 3. Database Migration
  migrate:
    container_name: migrate
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}

    environment:
      # Migration 컨테이너에는 Alembic 실행에 필요한 DB 설정만 주입합니다.
      # Admin·Runtime 비밀번호와 OpenAI·CLOVA 자격 증명은 전달하지 않습니다.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-10}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}

    command:
      - uv
      - run
      - --no-sync
      - alembic
      - upgrade
      - head

    networks:
      - ws

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  # Migration 직후 코드 head와 실제 DB 카탈로그가 일치하는지 읽기 전용으로 검증합니다.
  verify-db-head:
    profiles: ["database-maintenance"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "scripts.ci.verify_database_head"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-10}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
    networks:
      - ws

  # Admin credentials exist only in this explicit one-shot provisioning service.
  provision-db-roles:
    profiles: ["database-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "infra.python.provision_database_roles"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_APP_USER: ${DB_APP_USER}
      SOURCE_WRITER_USER: ${SOURCE_WRITER_USER}
      SOURCE_MANAGEMENT_USER: ${SOURCE_MANAGEMENT_USER:-}
      CATALOG_WRITER_USER: ${CATALOG_WRITER_USER:-}
      CATALOG_APPROVAL_USER: ${CATALOG_APPROVAL_USER:-}
      KNOWLEDGE_INDEX_BUILDER_USER: ${KNOWLEDGE_INDEX_BUILDER_USER:-}
      ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE: ${ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE:-}
      CANDIDATE_INDEX_BUILDER_USER: ${CANDIDATE_INDEX_BUILDER_USER:-}
    networks:
      - ws

  # 4. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}

    environment:
      # 애플리케이션 기본 설정
      ENV: ${ENV}
      SECRET_KEY: ${SECRET_KEY}
      IDEMPOTENCY_HMAC_KEY: ${IDEMPOTENCY_HMAC_KEY}
      # #180 B2: deployment Secret owns the Guide query-binding HMAC authority.
      GUIDE_QUERY_HMAC_KEY: ${GUIDE_QUERY_HMAC_KEY}
      GUIDE_QUERY_HMAC_KEY_VERSION: "${GUIDE_QUERY_HMAC_KEY_VERSION:-guide-query-hmac-key@1}"
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY: ${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY}
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY_VERSION: "${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY_VERSION:-v1}"
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_RETIRED_KEYS: "${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_RETIRED_KEYS:-{}}"
      TIMEZONE: ${TIMEZONE:-Asia/Seoul}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # FastAPI에는 Runtime DB 자격 증명만 주입합니다.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      ACCOUNT_WITHDRAWAL_REQUEST_ENABLED: ${ACCOUNT_WITHDRAWAL_REQUEST_ENABLED:-false}
      ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE: ${ACCOUNT_WITHDRAWAL_CLEANUP_DB_ROLE:-}
      ACCOUNT_WITHDRAWAL_CLEANUP_DB_PASSWORD: ${ACCOUNT_WITHDRAWAL_CLEANUP_DB_PASSWORD:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-10}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}

      # Web Push 설정. 실제 VAPID/암호화/HMAC secret은 배포 Secret에서 주입합니다.
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PRODUCTION_ENABLED: ${WEB_PUSH_PRODUCTION_ENABLED:-false}
      WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-[]}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_ENCRYPTION_KEYS: ${WEB_PUSH_ENCRYPTION_KEYS:-{}}
      WEB_PUSH_ACTIVE_KEY_ID: ${WEB_PUSH_ACTIVE_KEY_ID:-}
      WEB_PUSH_ENDPOINT_HMAC_KEY: ${WEB_PUSH_ENDPOINT_HMAC_KEY:-}
      # 이메일 발송 Provider 설정. Production 발송은 EMAIL_PROVIDER=smtp와 Secret 주입으로 활성화합니다.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SIGNUP_EMAIL_VERIFICATION_REQUIRED: ${SIGNUP_EMAIL_VERIFICATION_REQUIRED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}

      # 현재 FastAPI가 직접 사용하는 Provider 설정
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      GUIDE_RUNTIME_ENABLED: ${GUIDE_RUNTIME_ENABLED:-false}
      GUIDE_RUNTIME_BOOTSTRAP_FACTORY: ${GUIDE_RUNTIME_BOOTSTRAP_FACTORY:-}
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET}
      CLOVA_OCR_TIMEOUT_SECONDS: ${CLOVA_OCR_TIMEOUT_SECONDS:-20}
      OCR_CONSENT_POLICY_VERSION: ${OCR_CONSENT_POLICY_VERSION:-}
      # OCR 원문을 외부 LLM로 구조화하는 기능은 명시적으로 승인한 경우에만 활성화합니다.
      OCR_STRUCTURE_LLM_ENABLED: ${OCR_STRUCTURE_LLM_ENABLED:-false}
      OCR_STRUCTURE_MODEL: ${OCR_STRUCTURE_MODEL:-gpt-4o-mini}
      OCR_STRUCTURE_TIMEOUT_SECONDS: ${OCR_STRUCTURE_TIMEOUT_SECONDS:-30}
      # RAG-11 UI·RAG-12 Preflight·E2E·외부 승인 전에는 false를 유지합니다.
      PUBLIC_TRACK_F_ENABLED: ${PUBLIC_TRACK_F_ENABLED:-false}
      CHAT_HISTORY_CONTEXT_ENABLED: ${CHAT_HISTORY_CONTEXT_ENABLED:-false}
      # Guide CLOSED_DEMO RAG
      GUIDE_CLOSED_DEMO_RAG_ENABLED: ${GUIDE_CLOSED_DEMO_RAG_ENABLED:-false}
      GUIDE_CLOSED_DEMO_RAG_ALLOW_AUTHENTICATED_USERS: ${GUIDE_CLOSED_DEMO_RAG_ALLOW_AUTHENTICATED_USERS:-false}
      GUIDE_CLOSED_DEMO_RAG_USER_IDS: ${GUIDE_CLOSED_DEMO_RAG_USER_IDS:-}
      GUIDE_CLOSED_DEMO_RAG_STARTS_AT: ${GUIDE_CLOSED_DEMO_RAG_STARTS_AT:-}
      GUIDE_CLOSED_DEMO_RAG_EXPIRES_AT: ${GUIDE_CLOSED_DEMO_RAG_EXPIRES_AT:-}
      SOURCE591_STAGING_DB_HOST: ${SOURCE591_STAGING_DB_HOST:-}
      SOURCE591_STAGING_DB_PORT: ${SOURCE591_STAGING_DB_PORT:-5432}
      SOURCE591_CONSUMER_PASSWORD: ${SOURCE591_CONSUMER_PASSWORD:-}

      # 업로드 파일이 영속 volume 아래에 저장되도록 고정합니다.
      STORAGE_DIR: ${STORAGE_DIR:-/app/media/medical_documents}

    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media

    restart: always
    # 운영 API 요청은 Nginx를 통해 받고, FastAPI는 내부 네트워크로 연결합니다.
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # HTTP liveness only: the app has no /api/v1/health route.
    # DB/Redis readiness and OCR completion are verified separately.
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # #434: explicitly enabled after deployment authorization and migration verification.
  notification-scheduler:
    profiles: ["notifications"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    init: true
    entrypoint: ["/app/.venv/bin/python", "-m", "app.commands.schedule_notifications"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      ENV: ${ENV}
      # Required by shared Config validation; no Provider/admin/migration credentials.
      SECRET_KEY: ${SECRET_KEY}
      IDEMPOTENCY_HMAC_KEY: ${IDEMPOTENCY_HMAC_KEY}
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY: ${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_CONNECTION_POOL_MAXSIZE: "2"
      SQLALCHEMY_ECHO: "false"
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PRODUCTION_ENABLED: ${WEB_PUSH_PRODUCTION_ENABLED:-false}
      WEB_PUSH_ALLOWED_HOSTS: ${WEB_PUSH_ALLOWED_HOSTS:-[]}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_ENCRYPTION_KEYS: ${WEB_PUSH_ENCRYPTION_KEYS:-{}}
      WEB_PUSH_ACTIVE_KEY_ID: ${WEB_PUSH_ACTIVE_KEY_ID:-}
      WEB_PUSH_ENDPOINT_HMAC_KEY: ${WEB_PUSH_ENDPOINT_HMAC_KEY:-}
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # #839: check-in deadline runtime. Not opt-in: without it, occurrences whose
  # confirmation deadline passed stay PENDING and the report keeps showing 예정.
  # Deployed and verified by scripts/deployment.sh like the other core services.
  checkin-deadline-scheduler:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    init: true
    entrypoint: ["/app/.venv/bin/python", "-m", "app.commands.schedule_checkin_deadlines"]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      ENV: ${ENV}
      # Required by shared Config validation; no Provider/admin/migration credentials.
      SECRET_KEY: ${SECRET_KEY}
      IDEMPOTENCY_HMAC_KEY: ${IDEMPOTENCY_HMAC_KEY}
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY: ${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_CONNECTION_POOL_MAXSIZE: "2"
      SQLALCHEMY_ECHO: "false"
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 5. OCR Consumer + Outbox Publisher + Recovery Scheduler
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}

    init: true
    command: ["/app/.venv/bin/python", "-m", "ai_worker.main"]
    stop_grace_period: 90s
    environment:
      ENV: ${ENV}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: "75"
      TIMEZONE: ${TIMEZONE:-Asia/Seoul}

      # Worker에는 Runtime DB 자격 증명만 주입합니다.
      # Admin·Migration 자격 증명은 전달하지 않습니다.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-10}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}

      # Worker가 실제 CLOVA OCR Provider를 실행하는 데 필요한 설정입니다.
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET}
      CLOVA_OCR_TIMEOUT_SECONDS: ${CLOVA_OCR_TIMEOUT_SECONDS:-20}
      OCR_CONSENT_POLICY_VERSION: ${OCR_CONSENT_POLICY_VERSION:-}
      OCR_STRUCTURE_LLM_ENABLED: ${OCR_STRUCTURE_LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OCR_STRUCTURE_MODEL: ${OCR_STRUCTURE_MODEL:-gpt-4o-mini}
      OCR_STRUCTURE_TIMEOUT_SECONDS: ${OCR_STRUCTURE_TIMEOUT_SECONDS:-30}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: ${OPENAI_EMBEDDING_TIMEOUT_SECONDS:-20}

      # 운영 Redis는 host port에 공개하지 않고 내부 network + 인증으로만 접근합니다.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-oryak:jobs}
      REDIS_DLQ_STREAM_NAME: ${REDIS_DLQ_STREAM_NAME:-oryak:jobs:dead-letter}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-ai-workers}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME:-ai-worker-prod}
      RECONCILER_CONSUMER_NAME: ${RECONCILER_CONSUMER_NAME:-ai-worker-reconciler}
      REDIS_BLOCK_MS: ${REDIS_BLOCK_MS:-5000}

      # FastAPI와 동일한 업로드 volume 경로를 사용합니다.
      STORAGE_DIR: ${STORAGE_DIR:-/app/media/medical_documents}

    volumes:
      - media_volume:/app/media:ro
    restart: unless-stopped
    # OCR uses remote CLOVA; leave memory for PostgreSQL/API on the demo host.
    mem_limit: 1G
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "ai_worker.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 6. Frontend + Nginx (정적 SPA 제공 및 API reverse proxy)
  nginx:
    container_name: nginx
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:frontend-${FRONTEND_VERSION}
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 7. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy


  # Explicit management profile only; ordinary API/Worker never receive this password.
  source-management:
    profiles: ["source-management"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "uvicorn", "app.admin.source_management_api:management_app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      ENV: ${ENV}
      SECRET_KEY: ${SECRET_KEY}
      IDEMPOTENCY_HMAC_KEY: ${IDEMPOTENCY_HMAC_KEY}
      IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY: ${IDEMPOTENCY_SNAPSHOT_ENCRYPTION_KEY}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${SOURCE_MANAGEMENT_USER:-}
      DB_PASSWORD: ${SOURCE_MANAGEMENT_PASSWORD:-}
      SOURCE_MANAGEMENT_USER: ${SOURCE_MANAGEMENT_USER:-}
      SQLALCHEMY_ECHO: "false"
    networks:
      - ws

  source-management-bootstrap:
    profiles: ["source-management-admin"]
    image: postgres:17
    restart: "no"
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/admin/configure-management-role.sql"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_ADMIN_USER}
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_APP_USER: ${DB_APP_USER}
      SOURCE_WRITER_USER: ${SOURCE_WRITER_USER}
      SOURCE_MANAGEMENT_USER: ${SOURCE_MANAGEMENT_USER:-}
      SOURCE_MANAGEMENT_PASSWORD: ${SOURCE_MANAGEMENT_PASSWORD:-}
    volumes:
      - ./postgres/configure-management-role.sql:/admin/configure-management-role.sql:ro
    networks:
      - ws

  source-management-permission:
    profiles: ["source-management-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "app.admin.source_management_permissions"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      SQLALCHEMY_ECHO: "false"
    networks:
      - ws

  # 운영자가 명시적으로 실행하는 일회성 작업. 일반 배포에서는 시작하지 않습니다.
  source-writer:
    profiles: ["source-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "ai_worker.admin.source_writer"]
    environment:
      SOURCE_WRITER_HOST: postgres
      SOURCE_WRITER_PORT: "5432"
      SOURCE_WRITER_NAME: ${DB_NAME}
      SOURCE_WRITER_USER: ${SOURCE_WRITER_USER:-}
      SOURCE_WRITER_PASSWORD: ${SOURCE_WRITER_PASSWORD:-}
      SOURCE_WRITER_ACTOR: ${SOURCE_WRITER_ACTOR:-}
    networks:
      - ws

  catalog-writer:
    profiles: ["catalog-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "ai_worker.admin.catalog_writer"]
    environment:
      CATALOG_WRITER_HOST: postgres
      CATALOG_WRITER_PORT: "5432"
      CATALOG_WRITER_NAME: ${DB_NAME}
      CATALOG_WRITER_USER: ${CATALOG_WRITER_USER:-}
      CATALOG_WRITER_PASSWORD: ${CATALOG_WRITER_PASSWORD:-}
      CATALOG_SOURCE_ARTIFACT_READER_ROOT: /artifacts
    volumes:
      - type: bind
        source: ${CATALOG_SOURCE_ARTIFACT_HOST_ROOT:-/dev/null}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ws

  # Catalog 승인 발급·철회 전용 one-shot. 일반 배포에서는 시작하지 않습니다.
  catalog-approval:
    profiles: ["catalog-approval-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "ai_worker.admin.catalog_approval"]
    environment:
      CATALOG_APPROVAL_HOST: postgres
      CATALOG_APPROVAL_PORT: "5432"
      CATALOG_APPROVAL_NAME: ${DB_NAME}
      CATALOG_APPROVAL_USER: ${CATALOG_APPROVAL_USER:-}
      CATALOG_APPROVAL_PASSWORD: ${CATALOG_APPROVAL_PASSWORD:-}
      CATALOG_SOURCE_ARTIFACT_READER_ROOT: /artifacts
    volumes:
      - type: bind
        source: ${CATALOG_SOURCE_ARTIFACT_HOST_ROOT:-/dev/null}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ws

  candidate-index-builder:
    profiles: ["candidate-index-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "scripts.candidate_index_builder"]
    environment:
      CANDIDATE_INDEX_BUILDER_HOST: postgres
      CANDIDATE_INDEX_BUILDER_PORT: "5432"
      CANDIDATE_INDEX_BUILDER_NAME: ${DB_NAME}
      CANDIDATE_INDEX_BUILDER_USER: ${CANDIDATE_INDEX_BUILDER_USER:-}
      CANDIDATE_INDEX_BUILDER_PASSWORD: ${CANDIDATE_INDEX_BUILDER_PASSWORD:-}
    networks:
      - ws

  # #811: Protected Retrieval DB provisioning one-shot service
  protected-retrieval-provision:
    profiles: ["protected-retrieval-admin"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "infra.python.provision_protected_retrieval", "--provision"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_APP_USER: ${DB_APP_USER}
      SOURCE_WRITER_USER: ${SOURCE_WRITER_USER}
      PROTECTED_DB_SCHEMA: ${PROTECTED_DB_SCHEMA:-}
      PROTECTED_DB_OWNER_ROLE: ${PROTECTED_DB_OWNER_ROLE:-}
      PROTECTED_DB_ACCESS_ROLE: ${PROTECTED_DB_ACCESS_ROLE:-}
      PROTECTED_DB_CONTROL_ROLE: ${PROTECTED_DB_CONTROL_ROLE:-}
      PROTECTED_DB_USER: ${PROTECTED_DB_USER:-}
      PROTECTED_DB_PASSWORD: ${PROTECTED_DB_PASSWORD:-}
      PROTECTED_DB_CONTROL_USER: ${PROTECTED_DB_CONTROL_USER:-}
      PROTECTED_DB_CONTROL_PASSWORD: ${PROTECTED_DB_CONTROL_PASSWORD:-}
      PROTECTED_DB_BACKUP_USER: ${PROTECTED_DB_BACKUP_USER:-}
      PROTECTED_DB_BACKUP_PASSWORD: ${PROTECTED_DB_BACKUP_PASSWORD:-}
    networks:
      - ws

  # #811: Protected Retrieval Runner & Preflight one-shot service
  protected-retrieval-runner:
    profiles: ["protected-runner"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "ai_worker.admin.protected_retrieval_preflight"]
    environment:
      PROTECTED_RETRIEVAL_ENABLED: "true"
      PROTECTED_DB_HOST: postgres
      PROTECTED_DB_PORT: "5432"
      PROTECTED_DB_NAME: ${DB_NAME}
      PROTECTED_DB_SCHEMA: ${PROTECTED_DB_SCHEMA:-}
      PROTECTED_DB_ACCESS_ROLE: ${PROTECTED_DB_ACCESS_ROLE:-}
      PROTECTED_DB_CONTROL_ROLE: ${PROTECTED_DB_CONTROL_ROLE:-}
      PROTECTED_DB_USER: ${PROTECTED_DB_USER:-}
      PROTECTED_DB_PASSWORD: ${PROTECTED_DB_PASSWORD:-}
      PROTECTED_DB_CONTROL_USER: ${PROTECTED_DB_CONTROL_USER:-}
      PROTECTED_DB_CONTROL_PASSWORD: ${PROTECTED_DB_CONTROL_PASSWORD:-}
      PROTECTED_APPROVAL_REPOSITORY: ${PROTECTED_APPROVAL_REPOSITORY:-}
      PROTECTED_APPROVAL_BRANCH: ${PROTECTED_APPROVAL_BRANCH:-}
      PROTECTED_APPROVAL_GITHUB_TOKEN: ${PROTECTED_APPROVAL_GITHUB_TOKEN:-}
      DB_APP_USER: ${DB_APP_USER:-}
    networks:
      - ws

  # #889: exact-scope encrypted backup one-shot. The protected host mount is not shared.
  protected-retrieval-backup:
    profiles: ["protected-backup"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "infra.python.protected_retrieval_backup_ops"]
    environment:
      PROTECTED_DB_HOST: postgres
      PROTECTED_DB_PORT: "5432"
      PROTECTED_DB_NAME: ${DB_NAME}
      PROTECTED_DB_SCHEMA: ${PROTECTED_DB_SCHEMA:-}
      PROTECTED_DB_BACKUP_USER: ${PROTECTED_DB_BACKUP_USER:-}
      PROTECTED_DB_BACKUP_PASSWORD: ${PROTECTED_DB_BACKUP_PASSWORD:-}
      PROTECTED_BACKUP_HOST_ROOT: /protected-backups
      PROTECTED_BACKUP_ENCRYPTION_KEY: ${PROTECTED_BACKUP_ENCRYPTION_KEY:-}
      PROTECTED_BACKUP_ENCRYPTION_KEY_VERSION: ${PROTECTED_BACKUP_ENCRYPTION_KEY_VERSION:-}
      PROTECTED_BACKUP_ACL_POLICY_ID: ${PROTECTED_BACKUP_ACL_POLICY_ID:-}
    volumes:
      - type: bind
        source: ${PROTECTED_BACKUP_HOST_ROOT}
        target: /protected-backups
        bind:
          create_host_path: false
    networks:
      - ws

  # #889: disposable isolated PostgreSQL target; no port and no persistent volume.
  protected-retrieval-restore-db:
    profiles: ["protected-restore"]
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: ${PROTECTED_RESTORE_DB_NAME}
      POSTGRES_USER: ${PROTECTED_RESTORE_DB_USER}
      POSTGRES_PASSWORD: ${PROTECTED_RESTORE_DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ws

  # #889: verifier can reach only the fixed disposable alias and reads encrypted artifacts.
  protected-retrieval-restore:
    profiles: ["protected-restore"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "infra.python.protected_retrieval_backup_ops"]
    environment:
      PROTECTED_DB_SCHEMA: ${PROTECTED_DB_SCHEMA:-}
      PROTECTED_BACKUP_HOST_ROOT: /protected-backups
      PROTECTED_BACKUP_ENCRYPTION_KEY: ${PROTECTED_BACKUP_ENCRYPTION_KEY:-}
      PROTECTED_BACKUP_ENCRYPTION_KEY_VERSION: ${PROTECTED_BACKUP_ENCRYPTION_KEY_VERSION:-}
      PROTECTED_RESTORE_DB_HOST: protected-retrieval-restore-db
      PROTECTED_RESTORE_DB_PORT: "5432"
      PROTECTED_RESTORE_DB_NAME: ${PROTECTED_RESTORE_DB_NAME}
      PROTECTED_RESTORE_DB_USER: ${PROTECTED_RESTORE_DB_USER}
      PROTECTED_RESTORE_DB_PASSWORD: ${PROTECTED_RESTORE_DB_PASSWORD}
    volumes:
      - type: bind
        source: ${PROTECTED_BACKUP_HOST_ROOT}
        target: /protected-backups
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      protected-retrieval-restore-db:
        condition: service_healthy
    networks:
      - ws

  # #889: admin exists only for the explicit DATA/CONTROL credential rotation one-shot.
  protected-retrieval-rotate-db:
    profiles: ["protected-rotation"]
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    restart: "no"
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "infra.python.protected_retrieval_backup_ops", "rotate-db"]
    environment:
      PROTECTED_DB_HOST: postgres
      PROTECTED_DB_PORT: "5432"
      PROTECTED_DB_NAME: ${DB_NAME}
      PROTECTED_DB_SCHEMA: ${PROTECTED_DB_SCHEMA:-}
      PROTECTED_DB_ACCESS_ROLE: ${PROTECTED_DB_ACCESS_ROLE:-}
      PROTECTED_DB_CONTROL_ROLE: ${PROTECTED_DB_CONTROL_ROLE:-}
      PROTECTED_DB_USER: ${PROTECTED_DB_USER:-}
      PROTECTED_DB_PASSWORD: ${PROTECTED_DB_PASSWORD:-}
      PROTECTED_DB_PASSWORD_NEXT: ${PROTECTED_DB_PASSWORD_NEXT:-}
      PROTECTED_DB_CONTROL_USER: ${PROTECTED_DB_CONTROL_USER:-}
      PROTECTED_DB_CONTROL_PASSWORD: ${PROTECTED_DB_CONTROL_PASSWORD:-}
      PROTECTED_DB_CONTROL_PASSWORD_NEXT: ${PROTECTED_DB_CONTROL_PASSWORD_NEXT:-}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-}
    networks:
      - ws

volumes:
  # PostgreSQL 운영 데이터를 컨테이너 재생성 후에도 유지합니다.
  postgres_data:
    name: postgres_data

  # FastAPI와 Nginx가 공유하는 정적 파일을 유지합니다.
  static_volume:
    name: static_volume

  # 업로드된 파일과 생성된 미디어 파일을 유지합니다.
  media_volume:
    name: media_volume

  # Nginx와 Certbot이 공유하는 TLS 인증서를 유지합니다.
  certbot-conf:
    name: certbot-conf

  # Certbot HTTP-01 challenge 파일을 Nginx와 공유합니다.
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
