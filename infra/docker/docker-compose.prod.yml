services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      # PostgreSQL 초기화와 migration은 관리 계정으로 수행합니다.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_MIGRATION_USER}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD}

      # 제한된 애플리케이션 계정 생성 SQL에서 사용합니다.
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}

      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    networks:
      - ws
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # 신규·기존 DB 모두 같은 권한 설정 SQL을 실행할 수 있도록 mount합니다.
      - ./postgres/configure-app-role.sql:/docker-entrypoint-initdb.d/configure-app-role.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_MIGRATION_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 3. Database Migration
  migrate:
    container_name: migrate
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}

    # 서버에서 Compose와 같은 ~/project 디렉터리의 .env를 사용합니다.
    env_file:
      - ${SERVICE_ENV_FILE:-./.env}

    environment:
      # Alembic에는 migration 전용 계정을 주입합니다.
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}

    command:
      - uv
      - run
      - --no-sync
      - alembic
      - upgrade
      - head

    networks:
      - ws

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  # 4. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file:
      - ${SERVICE_ENV_FILE:-./.env}
    environment:
      # 런타임 애플리케이션에는 DDL 권한이 없는 계정을 주입합니다.
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
    # 정적 파일과 업로드 파일을 컨테이너 재생성 후에도 유지합니다.
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 5. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file:
      - ${SERVICE_ENV_FILE:-./.env}
    environment:
      # Worker도 FastAPI와 동일한 제한 계정을 사용합니다.
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 6. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 7. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  # PostgreSQL 운영 데이터를 컨테이너 재생성 후에도 유지합니다.
  postgres_data:
    name: postgres_data

  # FastAPI와 Nginx가 공유하는 정적 파일을 유지합니다.
  static_volume:
    name: static_volume

  # 업로드된 파일과 생성된 미디어 파일을 유지합니다.
  media_volume:
    name: media_volume

  # Nginx와 Certbot이 공유하는 TLS 인증서를 유지합니다.
  certbot-conf:
    name: certbot-conf

  # Certbot HTTP-01 challenge 파일을 Nginx와 공유합니다.
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
