services:
  postgres:
    image: postgres:17-alpine
    container_name: finalproject-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./postgres/configure-app-role.sql:/docker-entrypoint-initdb.d/configure-app-role.sql:ro
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: finalproject-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 64m

  configure-db-roles:
    image: postgres:17-alpine
    container_name: finalproject-staging-configure-db-roles
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./postgres/configure-app-role.sql:/workspace/configure-app-role.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${DB_ADMIN_USER}
      - -d
      - ${DB_NAME}
      - -f
      - /workspace/configure-app-role.sql
    networks:
      - staging_internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    container_name: finalproject-staging-migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-5}
      SQLALCHEMY_ECHO: "false"
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    networks:
      - staging_internal
    depends_on:
      configure-db-roles:
        condition: service_completed_successfully
    restart: "no"

  fastapi:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    container_name: finalproject-staging-fastapi
    restart: unless-stopped
    environment:
      ENV: staging
      SECRET_KEY: ${SECRET_KEY}
      IDEMPOTENCY_HMAC_KEY: ${IDEMPOTENCY_HMAC_KEY}
      TIMEZONE: ${TIMEZONE:-Asia/Seoul}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_CONNECTION_POOL_MAXSIZE: ${DB_CONNECTION_POOL_MAXSIZE:-5}
      SQLALCHEMY_ECHO: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      CHAT_HISTORY_CONTEXT_ENABLED: "false"
      RELEASE_VALIDATION_ALLOWED: "false"
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET}
      CLOVA_OCR_TIMEOUT_SECONDS: ${CLOVA_OCR_TIMEOUT_SECONDS:-20}
      OCR_STRUCTURE_LLM_ENABLED: ${OCR_STRUCTURE_LLM_ENABLED:-false}
      OCR_STRUCTURE_MODEL: ${OCR_STRUCTURE_MODEL:-gpt-4o-mini}
      OCR_STRUCTURE_TIMEOUT_SECONDS: ${OCR_STRUCTURE_TIMEOUT_SECONDS:-30}
      OCR_REQUEST_DEADLINE_SECONDS: ${OCR_REQUEST_DEADLINE_SECONDS:-60}
      OCR_RESPONSE_MARGIN_SECONDS: ${OCR_RESPONSE_MARGIN_SECONDS:-5}
      OCR_LOCAL_PROCESSING_RESERVE_SECONDS: ${OCR_LOCAL_PROCESSING_RESERVE_SECONDS:-3}
      OCR_PENDING_ACTIVE_WINDOW_SECONDS: ${OCR_PENDING_ACTIVE_WINDOW_SECONDS:-300}
      STORAGE_DIR: /app/media/medical_documents
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    volumes:
      - staging_media:/app/media
    networks:
      - staging_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 768m

  nginx:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:frontend-${FRONTEND_VERSION}
    container_name: finalproject-staging-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - staging_internal
    depends_on:
      fastapi:
        condition: service_healthy
    mem_limit: 64m

volumes:
  staging_postgres_data:
    name: finalproject-staging-postgres-data
  staging_media:
    name: finalproject-staging-media

networks:
  staging_internal:
    name: finalproject-staging-internal
    driver: bridge
