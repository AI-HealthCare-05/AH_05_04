upstream fastapi {
    server fastapi:8000;
}

# http
server {
    listen 80;
    server_name 도메인;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        return 404;
    }
}

# https
server {
    server_name 도메인;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/도메인/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/도메인/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        # 30MiB 파일과 multipart 부가 데이터를 허용합니다.
        # 파일 자체의 30MiB 제한은 Backend에서 검증합니다.
        client_max_body_size 32m;
        error_page 413 = /api/v1/_internal/upload-too-large;

        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }
    location = /api/v1/_internal/upload-too-large {
        internal;

        # 내부 이동 시 원래 Content-Length로 다시 차단되지 않게 합니다.
        # 이 위치에서는 원래 요청 본문을 upstream으로 보내지 않습니다.
        client_max_body_size 0;

        proxy_pass http://fastapi;
        proxy_method GET;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Content-Type "";

        # 크기 초과 응답이 별도의 검증용 헤더 오류로 바뀌지 않게 합니다.
        proxy_set_header X-Validation-Run-Id "";

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
