upstream fastapi {
    server fastapi:8000;
}

# CloudFront origin custom header의 값은 배포 시 실제 secret으로 치환합니다.
map $http_x_origin_verify $cloudfront_origin_verified {
    default 0;
    "__CLOUDFRONT_ORIGIN_VERIFY_SECRET__" 1;
}

server {
    listen 80;
    server_name production.cloudfront.net;

    root /usr/share/nginx/html;
    index index.html;

    # Docker health check는 CloudFront를 거치지 않으므로 검증 header를 요구하지 않습니다.
    # EC2 Security Group은 80번 접근을 CloudFront origin-facing prefix list로 제한합니다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        if ($cloudfront_origin_verified = 0) {
            return 403;
        }

        client_max_body_size 32m;
        error_page 413 = /api/v1/_internal/upload-too-large;

        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Viewer는 CloudFront에서 HTTPS로 강제하고 origin 구간만 HTTP를 사용합니다.
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /api/v1/_internal/upload-too-large {
        internal;

        client_max_body_size 0;

        proxy_pass http://fastapi;
        proxy_method GET;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Content-Type "";
        proxy_set_header X-Validation-Run-Id "";

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_intercept_errors off;
        proxy_buffering off;
    }

    location /assets/ {
        if ($cloudfront_origin_verified = 0) {
            return 403;
        }

        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        if ($cloudfront_origin_verified = 0) {
            return 403;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
