upstream fastapi {
    server fastapi:8000;
}

server {
    server_name production.example.com;

    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        # 30MiB 파일과 multipart 부가 데이터를 허용합니다.
        # 파일 자체의 30MiB 제한은 Backend에서 검증합니다.
        client_max_body_size 32m;
        error_page 413 = /api/v1/_internal/upload-too-large;

        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        # OCR_REQUEST_DEADLINE_SECONDS 기본값 60초보다 크게 둡니다.
        # Chat 동시 요청 한도 미확정에 따른 Production 공개 차단은 별도로 유지합니다.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location = /api/v1/_internal/upload-too-large {
        internal;

        # 내부 이동 시 원래 Content-Length로 다시 차단되지 않게 합니다.
        # 이 위치에서는 원래 요청 본문을 upstream으로 보내지 않습니다.
        client_max_body_size 0;

        proxy_pass http://fastapi;
        proxy_method GET;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Content-Type "";

        # 크기 초과 응답이 별도의 검증용 헤더 오류로 바뀌지 않게 합니다.
        proxy_set_header X-Validation-Run-Id "";

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
