services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database mySQL -> postgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      # 개발환경에서는 이 사용자가 DB owner가 됩니다.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

      # 신규 volume 초기화 시 UTF-8을 사용합니다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 컨테이너 내부 포트는 항상 5432입니다.
      - "${DB_EXPOSE_PORT}:5432"
    networks:
      - ws
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # 프로세스뿐 아니라 대상 DB가 실제 연결 가능한지 확인합니다.
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 3. Database Migration
  migrate:
    container_name: migrate
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file:
        - ./envs/.local.env
    command:
      - uv
      - run
      - --no-sync
      - alembic
      - upgrade
      - head
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 4. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: backend/app/Dockerfile  # Dockerfile 위치 지정
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file:
        - ./envs/.local.env
    environment:
      # .local.env에 STORAGE_DIR이 없어도 컨테이너 내부 기본 경로를 보장합니다.
      STORAGE_DIR: ${STORAGE_DIR:-/app/uploads/medical_documents}
    command: |
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app  # 로컬의 app 디렉토리를 컨테이너의 /app/app에 마운트(수정사항 즉시 반영)
      - static_volume:/app/templates
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 5. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: ai_worker/Dockerfile  # Dockerfile 위치 지정
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file:
        - ./envs/.local.env
    restart: "no"
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 6. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
    ports:
      - "80:80"
    networks:
      - ws
    depends_on:
      - fastapi

volumes:
  postgres_data:
  static_volume:

networks:
  ws:
    driver: bridge
